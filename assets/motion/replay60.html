<title>은하–단풍 60초 리플레이</title>

:root{
  --bg:#F3F6FA; --fg:#00233F; --muted:#5B6B7E; --line:#D8E0EA; --card:#FFFFFF; --accent:#3B92F2; --chip:#E8EEF5;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B1624;--fg:#E6EDF5;--muted:#93A3B6;--line:#233447;--card:#101F31;--accent:#5AA6F5;--chip:#18293D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1624;--fg:#E6EDF5;--muted:#93A3B6;--line:#233447;--card:#101F31;--accent:#5AA6F5;--chip:#18293D;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:28px 48px}
.kicker{font-size:13px;letter-spacing:.08em;color:var(--muted);font-weight:500}
h1{font-family:var(--f-head);font-weight:400;font-size:clamp(26px,4vw,40px);line-height:1.2;margin:.2em 0 .25em;text-wrap:balance}
.dek{color:var(--muted);margin:0 0 18px;max-width:70ch}
#frame{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:10px;background:#F3F6FA;cursor:pointer;box-shadow:0 1px 0 var(--line),0 10px 30px rgba(0,35,63,.10)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#stage canvas{display:block}
.ctrl{display:flex;align-items:center;gap:12px;margin-top:12px}
#play{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--fg);color:var(--bg);cursor:pointer;display:grid;place-items:center}
#play:focus-visible,.chip:focus-visible,#scrub:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#play::before{content:"";width:0;height:0;border-left:13px solid currentColor;border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:3px}
#play[data-state="pause"]::before{width:12px;height:14px;border:0;margin:0;background:linear-gradient(90deg,currentColor 0 4px,transparent 4px 8px,currentColor 8px 12px)}
#scrub{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent) var(--p,0%),var(--line) var(--p,0%));cursor:pointer}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--fg)}
#scrub::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--fg)}
#tlabel{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;min-width:88px;text-align:right}
#chapters{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip .ct{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:6px}
.chip[aria-current="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip[aria-current="true"] .ct{color:inherit;opacity:.7}
.notes{margin-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px 28px;border-top:1px solid var(--line);padding-top:18px}
.notes h2{font-size:13px;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:0 0 6px}
.notes p,.notes li{font-size:14px;margin:0;color:var(--fg);min-width:0}
.notes ul{margin:0;padding-left:18px}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
/* 렌더 모드: 무대만 */
html.render,html.render body{background:#F3F6FA;margin:0;padding:0;overflow:hidden}
html.render .wrap>*:not(#frame){display:none}
html.render .wrap{padding:0;max-width:none}
html.render #frame{position:static;border-radius:0;box-shadow:none;aspect-ratio:auto;width:1920px;height:1080px}
html.render #stage{transform:none!important}

</style>

<div class="wrap">

  <p class="hint">화면을 누르거나 스페이스 키로 재생·정지, 좌우 화살표로 1초씩 이동합니다.</p>
  <div class="notes" id="notes"></div>
</div>
<script>
// motion_kit.js — 데이터 랩 데모 모션 공용 부품 (빌드 때 __KIT_JS__ 자리에 들어간다)
// 계약: window.DURATION / window.LOOP / window.HOLD_T / window.ready / window.seek(t)
// 모든 그림은 draw(t)가 t만으로 계산한다. ?render 이면 재생 컨트롤 없이 1920x1080 무대만 남긴다.
const MK = (() => {
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const lerp = (a, b, p) => a + (b - a) * p;
  const E = {
    linear: p => p,
    inOutCubic: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
    outCubic: p => 1 - Math.pow(1 - p, 3),
    outQuart: p => 1 - Math.pow(1 - p, 4),
    outBack: p => { const c = 1.4; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); },
    inOutSine: p => -(Math.cos(Math.PI * p) - 1) / 2,
  };
  function stagger(t, start, i, n, span, each) {
    const gap = n > 1 ? (span - each) / (n - 1) : 0;
    return seg(t, start + i * gap, start + i * gap + each);
  }
  // 등장·퇴장 창: a~a+fi 동안 들어오고 b-fo~b 동안 나간다
  const win = (t, a, b, fi = .4, fo = .4) => Math.min(E.outCubic(seg(t, a, a + fi)), 1 - E.inOutCubic(seg(t, b - fo, b)));

  // 조사: 받침 있으면 a, 없으면 b (한글·숫자)
  function josa(w, a, b) {
    const c = String(w).trim().slice(-1);
    const code = c.charCodeAt(0);
    if (code >= 0xAC00 && code <= 0xD7A3) return w + (((code - 0xAC00) % 28) ? a : b);
    if (/[0-9]/.test(c)) return w + ('013678'.includes(c) ? a : b);
    return w + b;
  }
  const sgn = (v, d = 1) => (v > 0 ? '+' : v < 0 ? '−' : '±') + Math.abs(v).toFixed(d);

  // ---------- 캔버스 도우미 ----------
  function rr(x, X, Y, w, h, r) { x.beginPath(); x.roundRect ? x.roundRect(X, Y, w, h, r) : x.rect(X, Y, w, h); }
  function txt(x, s, X, Y, { font, color, align = 'left', base = 'alphabetic', alpha = 1 } = {}) {
    if (alpha <= 0) return 0;
    x.save(); x.globalAlpha *= alpha; if (font) x.font = font; if (color) x.fillStyle = color;
    x.textAlign = align; x.textBaseline = base; x.fillText(s, X, Y); const w = x.measureText(s).width; x.restore(); return w;
  }
  // <em>..</em> 을 강조색으로 그리는 한 줄 텍스트 (가운데 정렬)
  function richCenter(x, html, cx, Y, font, color, emColor) {
    const parts = []; html.replace(/<em>(.*?)<\/em>|([^<]+)/g, (m, em, pl) => { parts.push([em ?? pl, !!em]); });
    x.save(); x.font = font; x.textBaseline = 'alphabetic';
    const tot = parts.reduce((s, [p]) => s + x.measureText(p).width, 0);
    let X = cx - tot / 2;
    for (const [p, em] of parts) { x.fillStyle = em ? emColor : color; x.fillText(p, X, Y); X += x.measureText(p).width; }
    x.restore(); return tot;
  }

  // ---------- 경기장 (105x68 m) ----------
  function pitch(x0, y0, w) {
    const h = w * 68 / 105;
    return { x0, y0, w, h, X: v => x0 + v / 100 * w, Y: v => y0 + v / 100 * h, mx: m => x0 + m / 105 * w, my: m => y0 + m / 68 * h, s: w / 105 };
  }
  // p: 선 그리기 진행률(0..1), 줄무늬·선 색은 팔레트에서
  function drawPitch(x, P, C, p = 1, alpha = 1) {
    if (alpha <= 0) return;
    x.save(); x.globalAlpha *= alpha;
    const { x0, y0, w, h, mx, my, s } = P;
    const fill = E.outCubic(seg(p, 0, .35));
    x.globalAlpha *= 1; x.fillStyle = C.turf; x.globalAlpha = alpha * fill; x.fillRect(x0, y0, w, h);
    for (let i = 0; i < 12; i++) if (i % 2) { x.fillStyle = C.turf2; x.fillRect(x0 + i * w / 12, y0, w / 12, h); }
    x.globalAlpha = alpha;
    x.strokeStyle = C.line; x.lineWidth = 2.5; x.lineCap = 'round';
    const q = E.inOutCubic(seg(p, .15, 1));
    // 외곽선은 둘레를 따라 그려지고, 나머지는 q에 맞춰 나타난다
    const per = 2 * (w + h); let L = per * q;
    x.beginPath(); x.moveTo(x0, y0);
    const seglen = [[w, 0], [0, h], [-w, 0], [0, -h]]; let cx = x0, cy = y0;
    for (const [dx, dy] of seglen) { const l = Math.abs(dx + dy); const f = clamp(L / l); cx += dx * f; cy += dy * f; x.lineTo(cx, cy); L -= l; if (L <= 0) break; }
    x.stroke();
    x.globalAlpha = alpha * seg(q, .4, 1);
    x.beginPath(); x.moveTo(mx(52.5), y0); x.lineTo(mx(52.5), y0 + h); x.stroke();
    x.beginPath(); x.arc(mx(52.5), my(34), 9.15 * s, 0, Math.PI * 2); x.stroke();
    x.fillStyle = C.line; x.beginPath(); x.arc(mx(52.5), my(34), 3, 0, 7); x.fill();
    for (const side of [0, 1]) {
      const gx = side ? 105 : 0, d = side ? -1 : 1;
      x.strokeRect(Math.min(mx(gx), mx(gx + d * 16.5)), my(34 - 20.16), 16.5 * s, 40.32 * s);
      x.strokeRect(Math.min(mx(gx), mx(gx + d * 5.5)), my(34 - 9.16), 5.5 * s, 18.32 * s);
      x.beginPath(); x.arc(mx(gx + d * 11), my(34), 3, 0, 7); x.fill();
      const a = Math.acos(5.5 / 9.15);
      x.beginPath(); side ? x.arc(mx(94), my(34), 9.15 * s, Math.PI - a, Math.PI + a) : x.arc(mx(11), my(34), 9.15 * s, -a, a); x.stroke();
      x.lineWidth = 5; x.beginPath(); x.moveTo(mx(gx) - d * 3, my(34 - 3.66)); x.lineTo(mx(gx) - d * 3, my(34 + 3.66)); x.stroke(); x.lineWidth = 2.5;
    }
    x.restore();
  }

  // ---------- 이미지 ----------
  function img(src) { if (!src) return Promise.resolve(null); const i = new Image(); i.src = src; return i.decode().then(() => i, () => null); }

  // ---------- 무대 + 재생기 ----------
  // opts: {draw, duration, hold, chapters:[{t,label}], fonts:[...], before: Promise}
  function mount(opts) {
    const W = 1920, H = 1080;
    window.DURATION = opts.duration; window.LOOP = false; window.HOLD_T = opts.hold;
    const RENDER = new URLSearchParams(location.search).has('render');
    const stage = document.getElementById('stage');
    let cur = 0;
    const paint = t => { cur = clamp(t, 0, opts.duration); opts.draw(cur); if (ui.sync) ui.sync(cur); };
    const ui = {};
    // 구글 폰트 한글은 글자 묶음(unicode-range)별로 늦게 받아진다 → 페이지에 쓰일 글자를 전부 미리 받는다
    const chars = [...new Set([...document.scripts].map(s => s.textContent).join('') + document.body.innerText)].filter(c => c.charCodeAt(0) > 32).join('');
    window.ready = Promise.all([...(opts.fonts || []).map(f => document.fonts.load(f, chars)), opts.before || true])
      .then(() => document.fonts.ready).then(() => { paint(0); return true; });
    window.seek = s => paint(s);
    if (RENDER) { document.documentElement.classList.add('render'); return; }

    const frame = document.getElementById('frame');
    const fit = () => { const s = frame.clientWidth / W; stage.style.transform = `scale(${s})`; };
    new ResizeObserver(fit).observe(frame); fit();

    const btn = document.getElementById('play'), bar = document.getElementById('scrub'), tl = document.getElementById('tlabel');
    const chap = document.getElementById('chapters');
    bar.max = opts.duration; bar.step = 1 / 30;
    const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
    let playing = false, t0 = 0, from = 0, raf = 0;
    const setPlay = v => {
      playing = v; btn.setAttribute('aria-label', v ? '일시정지' : '재생'); btn.dataset.state = v ? 'pause' : 'play';
      if (v) { if (cur >= opts.duration - .01) cur = 0; from = cur; t0 = performance.now(); raf = requestAnimationFrame(loop); }
      else cancelAnimationFrame(raf);
    };
    function loop(n) { const t = from + (n - t0) / 1000; paint(t); if (t >= opts.duration) { setPlay(false); return; } raf = requestAnimationFrame(loop); }
    ui.sync = t => {
      bar.value = t; tl.textContent = `${fmt(t)} / ${fmt(opts.duration)}`;
      bar.style.setProperty('--p', (t / opts.duration * 100).toFixed(2) + '%');
      if (chap) [...chap.children].forEach((b, i) => {
        const a = opts.chapters[i].t, z = i + 1 < opts.chapters.length ? opts.chapters[i + 1].t : opts.duration;
        b.setAttribute('aria-current', t >= a && t < z ? 'true' : 'false');
      });
    };
    btn.addEventListener('click', () => setPlay(!playing));
    bar.addEventListener('input', () => { if (playing) setPlay(false); paint(+bar.value); });
    frame.addEventListener('click', () => setPlay(!playing));
    addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
      if (e.code === 'Space') { e.preventDefault(); setPlay(!playing); }
      if (e.code === 'ArrowRight') { setPlay(false); paint(cur + 1); }
      if (e.code === 'ArrowLeft') { setPlay(false); paint(cur - 1); }
    });
    if (chap) opts.chapters.forEach(c => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'chip';
      b.innerHTML = `<span class="ct">${fmt(c.t)}</span>${c.label}`;
      b.addEventListener('click', () => { setPlay(false); paint(c.t + .01); setPlay(true); });
      chap.appendChild(b);
    });
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.ready.then(() => { if (reduce) paint(opts.hold); else setPlay(true); });
  }

  return { clamp, seg, lerp, E, stagger, win, josa, sgn, rr, txt, richCenter, pitch, drawPitch, img, mount };
})();

</script>

  }

// 점유 구역 = 팀별 터치 히트맵(많음 빨강 → 적음 파랑). 홈 팀 전체 필드 → 원정 팀 전체 필드
const HEAT_STOPS = [[0, [37, 82, 214]], [.3, [0, 182, 226]], [.5, [72, 196, 92]], [.72, [250, 214, 40]], [1, [226, 38, 30]]];
function heatColor(v) {
  for (let i = 1; i < HEAT_STOPS.length; i++) { const [p1, c1] = HEAT_STOPS[i]; if (v <= p1) { const [p0, c0] = HEAT_STOPS[i - 1], q = (v - p0) / (p1 - p0); return c0.map((c, j) => Math.round(lerp(c, c1[j], q))); } }
  return HEAT_STOPS[HEAT_STOPS.length - 1][1];
}
const HEAT = {};
for (const side of ['h', 'a']) {   // 밀도값을 먼저 이중선형 보간한 뒤 색을 입힌다(색·투명도를 늘려 그리면 경계가 계단처럼 깨짐)
  const h = D.heat[side], RW = 525, RH = 340, c = document.createElement('canvas'); c.width = RW; c.height = RH;
  const g = c.getContext('2d'), im = g.createImageData(RW, RH), V = (i, j) => h.v[clamp(j, 0, h.ny - 1) * h.nx + clamp(i, 0, h.nx - 1)];
  for (let py = 0; py < RH; py++) for (let px = 0; px < RW; px++) {
    const fx = (px + .5) / RW * h.nx - .5, fy = (py + .5) / RH * h.ny - .5, i = Math.floor(fx), j = Math.floor(fy), u = fx - i, w = fy - j;
    const v = (V(i, j) * (1 - u) + V(i + 1, j) * u) * (1 - w) + (V(i, j + 1) * (1 - u) + V(i + 1, j + 1) * u) * w;
    const [r, gg, b] = heatColor(v), al = Math.min(1, v / .12) * (.38 + .5 * v);
    im.data.set([r, gg, b, Math.round(255 * al)], (py * RW + px) * 4);
  }
  g.putImageData(im, 0, 0); HEAT[side] = c;
}
const ZH = { h: [45.3, 48.7], a: [48.7, 52.2] };
