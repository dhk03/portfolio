<title>은하–단풍 전·후반 전술 비교</title>

:root{
  --bg:#F3F6FA; --fg:#00233F; --muted:#5B6B7E; --line:#D8E0EA; --card:#FFFFFF; --accent:#3B92F2; --chip:#E8EEF5;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B1624;--fg:#E6EDF5;--muted:#93A3B6;--line:#233447;--card:#101F31;--accent:#5AA6F5;--chip:#18293D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1624;--fg:#E6EDF5;--muted:#93A3B6;--line:#233447;--card:#101F31;--accent:#5AA6F5;--chip:#18293D;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:28px 48px}
.kicker{font-size:13px;letter-spacing:.08em;color:var(--muted);font-weight:500}
h1{font-family:var(--f-head);font-weight:400;font-size:clamp(26px,4vw,40px);line-height:1.2;margin:.2em 0 .25em;text-wrap:balance}
.dek{color:var(--muted);margin:0 0 18px;max-width:70ch}
#frame{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:10px;background:#F3F6FA;cursor:pointer;box-shadow:0 1px 0 var(--line),0 10px 30px rgba(0,35,63,.10)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#stage canvas{display:block}
.ctrl{display:flex;align-items:center;gap:12px;margin-top:12px}
#play{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--fg);color:var(--bg);cursor:pointer;display:grid;place-items:center}
#play:focus-visible,.chip:focus-visible,#scrub:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#play::before{content:"";width:0;height:0;border-left:13px solid currentColor;border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:3px}
#play[data-state="pause"]::before{width:12px;height:14px;border:0;margin:0;background:linear-gradient(90deg,currentColor 0 4px,transparent 4px 8px,currentColor 8px 12px)}
#scrub{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent) var(--p,0%),var(--line) var(--p,0%));cursor:pointer}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--fg)}
#scrub::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--fg)}
#tlabel{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;min-width:88px;text-align:right}
#chapters{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip .ct{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:6px}
.chip[aria-current="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip[aria-current="true"] .ct{color:inherit;opacity:.7}
.notes{margin-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px 28px;border-top:1px solid var(--line);padding-top:18px}
.notes h2{font-size:13px;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:0 0 6px}
.notes p,.notes li{font-size:14px;margin:0;color:var(--fg);min-width:0}
.notes ul{margin:0;padding-left:18px}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
/* 렌더 모드: 무대만 */
html.render,html.render body{background:#F3F6FA;margin:0;padding:0;overflow:hidden}
html.render .wrap>*:not(#frame){display:none}
html.render .wrap{padding:0;max-width:none}
html.render #frame{position:static;border-radius:0;box-shadow:none;aspect-ratio:auto;width:1920px;height:1080px}
html.render #stage{transform:none!important}

<div class="wrap">

  <div class="ctrl"><button id="play" type="button" aria-label="재생"></button><input id="scrub" type="range" min="0" value="0" aria-label="재생 위치"><span id="tlabel">0:00</span></div>

</div>
<script>
// motion_kit.js — 데이터 랩 데모 모션 공용 부품 (빌드 때 __KIT_JS__ 자리에 들어간다)
// 계약: window.DURATION / window.LOOP / window.HOLD_T / window.ready / window.seek(t)
// 모든 그림은 draw(t)가 t만으로 계산한다. ?render 이면 재생 컨트롤 없이 1920x1080 무대만 남긴다.
const MK = (() => {
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const lerp = (a, b, p) => a + (b - a) * p;
  const E = {
    linear: p => p,
    inOutCubic: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
    outCubic: p => 1 - Math.pow(1 - p, 3),
    outQuart: p => 1 - Math.pow(1 - p, 4),
    outBack: p => { const c = 1.4; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); },
    inOutSine: p => -(Math.cos(Math.PI * p) - 1) / 2,
  };
  function stagger(t, start, i, n, span, each) {
    const gap = n > 1 ? (span - each) / (n - 1) : 0;
    return seg(t, start + i * gap, start + i * gap + each);
  }
  // 등장·퇴장 창: a~a+fi 동안 들어오고 b-fo~b 동안 나간다
  const win = (t, a, b, fi = .4, fo = .4) => Math.min(E.outCubic(seg(t, a, a + fi)), 1 - E.inOutCubic(seg(t, b - fo, b)));

  // 조사: 받침 있으면 a, 없으면 b (한글·숫자)
  function josa(w, a, b) {
    const c = String(w).trim().slice(-1);
    const code = c.charCodeAt(0);
    if (code >= 0xAC00 && code <= 0xD7A3) return w + (((code - 0xAC00) % 28) ? a : b);
    if (/[0-9]/.test(c)) return w + ('013678'.includes(c) ? a : b);
    return w + b;
  }
  const sgn = (v, d = 1) => (v > 0 ? '+' : v < 0 ? '−' : '±') + Math.abs(v).toFixed(d);

  // ---------- 캔버스 도우미 ----------
  function rr(x, X, Y, w, h, r) { x.beginPath(); x.roundRect ? x.roundRect(X, Y, w, h, r) : x.rect(X, Y, w, h); }
  function txt(x, s, X, Y, { font, color, align = 'left', base = 'alphabetic', alpha = 1 } = {}) {
    if (alpha <= 0) return 0;
    x.save(); x.globalAlpha *= alpha; if (font) x.font = font; if (color) x.fillStyle = color;
    x.textAlign = align; x.textBaseline = base; x.fillText(s, X, Y); const w = x.measureText(s).width; x.restore(); return w;
  }
  // <em>..</em> 을 강조색으로 그리는 한 줄 텍스트 (가운데 정렬)
  function richCenter(x, html, cx, Y, font, color, emColor) {
    const parts = []; html.replace(/<em>(.*?)<\/em>|([^<]+)/g, (m, em, pl) => { parts.push([em ?? pl, !!em]); });
    x.save(); x.font = font; x.textBaseline = 'alphabetic';
    const tot = parts.reduce((s, [p]) => s + x.measureText(p).width, 0);
    let X = cx - tot / 2;
    for (const [p, em] of parts) { x.fillStyle = em ? emColor : color; x.fillText(p, X, Y); X += x.measureText(p).width; }
    x.restore(); return tot;
  }

  // ---------- 경기장 (105x68 m) ----------
  function pitch(x0, y0, w) {
    const h = w * 68 / 105;
    return { x0, y0, w, h, X: v => x0 + v / 100 * w, Y: v => y0 + v / 100 * h, mx: m => x0 + m / 105 * w, my: m => y0 + m / 68 * h, s: w / 105 };
  }
  // p: 선 그리기 진행률(0..1), 줄무늬·선 색은 팔레트에서
  function drawPitch(x, P, C, p = 1, alpha = 1) {
    if (alpha <= 0) return;
    x.save(); x.globalAlpha *= alpha;
    const { x0, y0, w, h, mx, my, s } = P;
    const fill = E.outCubic(seg(p, 0, .35));
    x.globalAlpha *= 1; x.fillStyle = C.turf; x.globalAlpha = alpha * fill; x.fillRect(x0, y0, w, h);
    for (let i = 0; i < 12; i++) if (i % 2) { x.fillStyle = C.turf2; x.fillRect(x0 + i * w / 12, y0, w / 12, h); }
    x.globalAlpha = alpha;
    x.strokeStyle = C.line; x.lineWidth = 2.5; x.lineCap = 'round';
    const q = E.inOutCubic(seg(p, .15, 1));
    // 외곽선은 둘레를 따라 그려지고, 나머지는 q에 맞춰 나타난다
    const per = 2 * (w + h); let L = per * q;
    x.beginPath(); x.moveTo(x0, y0);
    const seglen = [[w, 0], [0, h], [-w, 0], [0, -h]]; let cx = x0, cy = y0;
    for (const [dx, dy] of seglen) { const l = Math.abs(dx + dy); const f = clamp(L / l); cx += dx * f; cy += dy * f; x.lineTo(cx, cy); L -= l; if (L <= 0) break; }
    x.stroke();
    x.globalAlpha = alpha * seg(q, .4, 1);
    x.beginPath(); x.moveTo(mx(52.5), y0); x.lineTo(mx(52.5), y0 + h); x.stroke();
    x.beginPath(); x.arc(mx(52.5), my(34), 9.15 * s, 0, Math.PI * 2); x.stroke();
    x.fillStyle = C.line; x.beginPath(); x.arc(mx(52.5), my(34), 3, 0, 7); x.fill();
    for (const side of [0, 1]) {
      const gx = side ? 105 : 0, d = side ? -1 : 1;
      x.strokeRect(Math.min(mx(gx), mx(gx + d * 16.5)), my(34 - 20.16), 16.5 * s, 40.32 * s);
      x.strokeRect(Math.min(mx(gx), mx(gx + d * 5.5)), my(34 - 9.16), 5.5 * s, 18.32 * s);
      x.beginPath(); x.arc(mx(gx + d * 11), my(34), 3, 0, 7); x.fill();
      const a = Math.acos(5.5 / 9.15);
      x.beginPath(); side ? x.arc(mx(94), my(34), 9.15 * s, Math.PI - a, Math.PI + a) : x.arc(mx(11), my(34), 9.15 * s, -a, a); x.stroke();
      x.lineWidth = 5; x.beginPath(); x.moveTo(mx(gx) - d * 3, my(34 - 3.66)); x.lineTo(mx(gx) - d * 3, my(34 + 3.66)); x.stroke(); x.lineWidth = 2.5;
    }
    x.restore();
  }

  // ---------- 이미지 ----------
  function img(src) { if (!src) return Promise.resolve(null); const i = new Image(); i.src = src; return i.decode().then(() => i, () => null); }

  // ---------- 무대 + 재생기 ----------
  // opts: {draw, duration, hold, chapters:[{t,label}], fonts:[...], before: Promise}
  function mount(opts) {
    const W = 1920, H = 1080;
    window.DURATION = opts.duration; window.LOOP = false; window.HOLD_T = opts.hold;
    const RENDER = new URLSearchParams(location.search).has('render');
    const stage = document.getElementById('stage');
    let cur = 0;
    const paint = t => { cur = clamp(t, 0, opts.duration); opts.draw(cur); if (ui.sync) ui.sync(cur); };
    const ui = {};
    // 구글 폰트 한글은 글자 묶음(unicode-range)별로 늦게 받아진다 → 페이지에 쓰일 글자를 전부 미리 받는다
    const chars = [...new Set([...document.scripts].map(s => s.textContent).join('') + document.body.innerText)].filter(c => c.charCodeAt(0) > 32).join('');
    window.ready = Promise.all([...(opts.fonts || []).map(f => document.fonts.load(f, chars)), opts.before || true])
      .then(() => document.fonts.ready).then(() => { paint(0); return true; });
    window.seek = s => paint(s);
    if (RENDER) { document.documentElement.classList.add('render'); return; }

    const frame = document.getElementById('frame');
    const fit = () => { const s = frame.clientWidth / W; stage.style.transform = `scale(${s})`; };
    new ResizeObserver(fit).observe(frame); fit();

    const btn = document.getElementById('play'), bar = document.getElementById('scrub'), tl = document.getElementById('tlabel');
    const chap = document.getElementById('chapters');
    bar.max = opts.duration; bar.step = 1 / 30;
    const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
    let playing = false, t0 = 0, from = 0, raf = 0;
    const setPlay = v => {
      playing = v; btn.setAttribute('aria-label', v ? '일시정지' : '재생'); btn.dataset.state = v ? 'pause' : 'play';
      if (v) { if (cur >= opts.duration - .01) cur = 0; from = cur; t0 = performance.now(); raf = requestAnimationFrame(loop); }
      else cancelAnimationFrame(raf);
    };
    function loop(n) { const t = from + (n - t0) / 1000; paint(t); if (t >= opts.duration) { setPlay(false); return; } raf = requestAnimationFrame(loop); }
    ui.sync = t => {
      bar.value = t; tl.textContent = `${fmt(t)} / ${fmt(opts.duration)}`;
      bar.style.setProperty('--p', (t / opts.duration * 100).toFixed(2) + '%');
      if (chap) [...chap.children].forEach((b, i) => {
        const a = opts.chapters[i].t, z = i + 1 < opts.chapters.length ? opts.chapters[i + 1].t : opts.duration;
        b.setAttribute('aria-current', t >= a && t < z ? 'true' : 'false');
      });
    };
    btn.addEventListener('click', () => setPlay(!playing));
    bar.addEventListener('input', () => { if (playing) setPlay(false); paint(+bar.value); });
    frame.addEventListener('click', () => setPlay(!playing));
    addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
      if (e.code === 'Space') { e.preventDefault(); setPlay(!playing); }
      if (e.code === 'ArrowRight') { setPlay(false); paint(cur + 1); }
      if (e.code === 'ArrowLeft') { setPlay(false); paint(cur - 1); }
    });
    if (chap) opts.chapters.forEach(c => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'chip';
      b.innerHTML = `<span class="ct">${fmt(c.t)}</span>${c.label}`;
      b.addEventListener('click', () => { setPlay(false); paint(c.t + .01); setPlay(true); });
      chap.appendChild(b);
    });
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.ready.then(() => { if (reduce) paint(opts.hold); else setPlay(true); });
  }

  return { clamp, seg, lerp, E, stagger, win, josa, sgn, rr, txt, richCenter, pitch, drawPitch, img, mount };
})();

</script>

function netOf(s, h) {

  for (const [a, b, c] of d.links) { const k = a < b ? a + '-' + b : b + '-' + a; m.set(k, (m.get(k) || 0) + c); }

function drawNet(s, h, P, t, t0, alpha = 1, { dimNodes = 0, subsAt = null } = {}) {

    const lb = labs[i];
    txt(x, p.n, px + lb.dx, py + lb.dy, { font: F(500, 17), color: isSub && sa > 0 ? '#9A6B00' : C.ink, align: lb.al, base: 'middle' });

// 이름표 자리: 아래 → 위 → 오른쪽 → 왼쪽 중 다른 원·이름표와 덜 겹치는 곳(결정적, t와 무관)
function placeLabels(nodes, X, Y, maxPv) {
  x.save(); x.font = F(500, 17);
  const R = p => 13 + 13 * Math.sqrt(p.pv / maxPv);
  const circles = nodes.map(p => [X(p.x), Y(p.y), R(p) + 2]);
  const placed = [], out = [];
  const order = nodes.map((p, i) => i).sort((a, b) => nodes[b].pv - nodes[a].pv);
  for (const i of order) {
    const p = nodes[i], px = X(p.x), py = Y(p.y), r = R(p), w = x.measureText(p.n).width, h = 20;
    const cands = [[0, r + 13, 'center'], [0, -r - 13, 'center'], [r + 6, 0, 'left'], [-r - 6, 0, 'right'], [0, r + 32, 'center'], [0, -r - 32, 'center']];
    let best = null, bs = 1e9;
    for (const [dx, dy, al] of cands) {
      const x0 = px + dx - (al === 'center' ? w / 2 : al === 'right' ? w : 0), y0 = py + dy - h / 2;
      let sc = 0;
      for (const [cx, cy, cr] of circles) { const nx = clamp(cx, x0, x0 + w), ny = clamp(cy, y0, y0 + h); if ((nx - cx) ** 2 + (ny - cy) ** 2 < cr * cr) sc += 3; }
      for (const b of placed) if (x0 < b[0] + b[2] && b[0] < x0 + w && y0 < b[1] + b[3] && b[1] < y0 + h) sc += 5;
      sc += cands.findIndex(c => c[0] === dx && c[1] === dy) * .1;
      if (sc < bs) { bs = sc; best = [dx, dy, al, x0, y0]; }
    }
    placed.push([best[3], best[4], w, h]); out[i] = { dx: best[0], dy: best[1], al: best[2] };

}

// 아래 비교 타일: 전반 → 후반
// 전반·후반 막대. sum: 막대 전체 = 전·후반 합계(옅은 색 전반은 왼쪽, 진한 색 후반은 오른쪽에서 채움)
//                 track: 막대 전체 = 0~100(경기장 길이·폭), 빈 원 = 전반, 찬 원 = 후반
function halfBar(X0, Y, w, h, v1, v2, kind, col, k) {
  x.save();
  x.fillStyle = '#E3E9F0'; rr(x, X0, Y, w, h, h / 2); x.fill();
  if (kind === 'sum') {
    const tot = v1 + v2;
    if (tot > 0) {
      const p1 = v1 / tot, p2 = v2 / tot, c1 = Math.round(p1 * 100), c2 = 100 - c1;
      x.save(); rr(x, X0, Y, w, h, h / 2); x.clip();
      x.globalAlpha *= .38; x.fillStyle = col; x.fillRect(X0, Y, w * p1 * k, h); x.globalAlpha /= .38;
      x.fillStyle = col; x.fillRect(X0 + w - w * p2 * k, Y, w * p2 * k, h);
      x.restore();
      x.strokeStyle = C.surface; x.lineWidth = 2; x.beginPath(); x.moveTo(X0 + w / 2, Y - 3); x.lineTo(X0 + w / 2, Y + h + 3); x.stroke();
      const ia = seg(k, .7, 1), fs = Math.round(h * .7);
      if (w * p1 > 46) txt(x, `${c1}%`, X0 + 9, Y + h / 2 + 1, { font: F(700, fs), color: C.ink, base: 'middle', alpha: ia });
      if (w * p2 > 46) txt(x, `${c2}%`, X0 + w - 9, Y + h / 2 + 1, { font: F(700, fs), color: '#FFFFFF', align: 'right', base: 'middle', alpha: ia });
    } else txt(x, '기록 없음', X0 + w / 2, Y + h / 2 + 1, { font: F(500, Math.round(h * .65)), color: C.muted, align: 'center', base: 'middle' });
  } else {
    const px = v => X0 + h / 2 + (w - h) * clamp(v / 100);
    const a1 = px(v1), a2 = lerp(a1, px(v2), k), cy = Y + h / 2;
    x.strokeStyle = col; x.lineWidth = h * .45; x.lineCap = 'round'; x.beginPath(); x.moveTo(a1, cy); x.lineTo(a2, cy); x.stroke();
    x.fillStyle = C.surface; x.lineWidth = 3; x.beginPath(); x.arc(a1, cy, h * .55, 0, 7); x.fill(); x.stroke();
    x.fillStyle = col; x.beginPath(); x.arc(a2, cy, h * .62, 0, 7); x.fill();
    txt(x, '0', X0, Y + h + 16, { font: F(400, 14), color: C.faint });
    txt(x, '100', X0 + w, Y + h + 16, { font: F(400, 14), color: C.faint, align: 'right' });
  }
  x.restore();
}

// 아래 비교 타일: 전반 → 후반 + 막대
function tiles(s, t, t0, alpha) {
  if (alpha <= 0) return;
  const a = tac(s)[1], b = tac(s)[2];
  const L = [['평균 위치', '0–100', a.line, b.line, 1, 'track'], ['가로 폭', '0–100', a.width, b.width, 1, 'track'],
    ['성공 패스', `합계 ${a.pass_ok + b.pass_ok}`, a.pass_ok, b.pass_ok, 0, 'sum'], ['공격 지역 액션', `합계 ${a.final3 + b.final3}`, a.final3, b.final3, 0, 'sum'],
    ['박스 안 터치', `합계 ${a.box + b.box}`, a.box, b.box, 0, 'sum']];
  const w = 1760 / L.length;
  L.forEach(([lab, base, v1, v2, d, kind], i) => {
    const k = E.outCubic(stagger(t, t0, i, L.length, 1.4, .6)); if (k <= 0) return;
    const X0 = 80 + i * w;
    x.save(); x.globalAlpha = alpha * k;
    x.font = F(500, 20); const lw = x.measureText(lab).width;
    txt(x, lab, X0, 884, { font: F(500, 20), color: C.muted });
    txt(x, `· ${base}`, X0 + lw + 6, 884, { font: F(400, 17), color: C.faint });
    const s1 = v1.toFixed(d), s2 = v2.toFixed(d);
    x.font = F(700, 30); const w1 = x.measureText(`${s1} → `).width;
    txt(x, `${s1} → `, X0, 922, { font: F(700, 30), color: C.faint });
    txt(x, s2, X0 + w1, 922, { font: F(700, 30), color: C.ink });
    x.font = F(700, 30); const w2 = x.measureText(s2).width;
    const dv = v2 - v1;
    txt(x, sgn(dv, d), X0 + w1 + w2 + 10, 920, { font: F(700, 20), color: dv > 0 ? TC[s] : C.muted });
    halfBar(X0, 934, w - 56, 20, v1, v2, kind, TC[s], k);
    x.restore();
  });
}

function caption(s, t, a0, a1, col) {
  const a = win(t, a0, a1, .4, .4); if (a <= 0) return;
  x.save(); x.globalAlpha = a; x.font = F(700, 26);
  const w = x.measureText(s).width + 48;
  x.fillStyle = C.surface; x.shadowColor = 'rgba(0,35,63,.14)'; x.shadowBlur = 18; x.shadowOffsetY = 4;
  rr(x, CX - w / 2, 982, w, 48, 24); x.fill(); x.shadowColor = 'transparent';
  txt(x, s, CX, 1007, { font: F(700, 26), color: col || C.ink, align: 'center', base: 'middle' });
  x.restore();
}

function teamBlock(s, t, t0, t1, withLanes) {
  const a = win(t, t0, t1, .5, .5); if (a <= 0) return;
  header(s, t, t0, t1);
  drawPitch(x, P1, C, seg(t, t0, t0 + 1.1), a); drawPitch(x, P2, C, seg(t, t0 + .15, t0 + 1.25), a);
  const L = laneLine(s);
  const laneOn = withLanes ? seg(t, S.lane[0], S.lane[0] + .6) : 0;
  const [oS, oL, oT] = withLanes ? [5.6, 7.6, 8.8] : [4.0, 5.6, 6.4];
  const subsAt = t0 + oS;
  drawNet(s, 1, P1, t, t0, a, { dimNodes: laneOn, subsAt });
  drawNet(s, 2, P2, t, t0 + .3, a, { dimNodes: laneOn, subsAt });
  const lineT = t0 + oL;
  const la = a * (1 - laneOn);
  lineMark(s, 1, P1, t, lineT, la, null); lineMark(s, 2, P2, t, lineT + .4, la, tac(s)[1].line);
  if (withLanes) {
    lanes(s, 1, P1, t, S.lane[0] + .3, a, L); lanes(s, 2, P2, t, S.lane[0] + 2.0, a, L);
    for (const [h, P] of [[1, P1], [2, P2]]) {   // 공격 지역 진입 성공 패스: 끝점 방향
      const en = tac(s)[h].entries, ea = a * E.outCubic(seg(t, S.lane[0] + 4.6 + h * .5, S.lane[0] + 5.2 + h * .5));
      txt(x, `공격 지역 진입 성공 패스 ${en.reduce((p, q) => p + q, 0)}회 · 왼쪽 ${en[0]} · 중앙 ${en[1]} · 오른쪽 ${en[2]}`, P.x0 + P.w / 2, P.y0 + P.h + 40, { font: F(500, 22), color: C.ink, align: 'center', alpha: ea });
    }
  }
  tiles(s, t, t0 + oT, a * (1 - laneOn));
  // 캡션: 교체 → 평균 위치 → (공격 방향)
  const subs = subLabel(s);
  const subTxt = subs.length ? `금색 테두리 = 교체 투입 ${subs.map(q => q.inn).join('·')}` : '교체 없음';
  caption(subTxt, t, subsAt, lineT - .1, C.ink);
  const d = tac(s)[2].line - tac(s)[1].line;
  caption(`평균 위치 ${tac(s)[1].line.toFixed(1)} → ${tac(s)[2].line.toFixed(1)} · 후반에 ${Math.abs(d) < .5 ? '비슷한 높이' : d > 0 ? '더 높이 올라섬' : '더 깊이 내려섬'}`, t, lineT, withLanes ? S.lane[0] : t1 - .2, TC[s]);
  if (withLanes) caption(L.text, t, S.lane[0] + 2.8, t1 - .2, TC[s]);
}

function drawTitle(t) {
  const a = 1 - E.inOutCubic(seg(t, S.title[1] - .6, S.title[1])); if (a <= 0) return;
  const up = 1 - E.outCubic(seg(t, 0, .6));
  x.save(); x.globalAlpha = a;
  txt(x, `가상 리그 ${M.round}라운드 · ${M.date.replaceAll('-', '.')} (${M.wd}) · ${M.stadium}`, CX, 330 + 16 * up, { font: F(500, 30), color: C.muted, align: 'center' });
  txt(x, `${M.hn} ${M.hs}–${M.as_} ${M.an}`, CX, 440 + 16 * up, { font: F(400, 96, FH), color: C.ink, align: 'center' });
  const k1 = E.outCubic(seg(t, .4, 1.0)), k2 = E.outCubic(seg(t, .9, 1.5));
  for (const [h, k, X] of [[1, k1, CX - 260], [2, k2, CX + 260]]) {
    x.globalAlpha = a * k;
    x.fillStyle = C.surface; rr(x, X - 220, 500, 440, 170, 16); x.fill();
    txt(x, h === 1 ? '전반' : '후반', X, 552, { font: F(500, 26), color: C.muted, align: 'center' });
    txt(x, `${HS[h][0]} – ${HS[h][1]}`, X, 640, { font: F(400, 84, FH), color: C.ink, align: 'center' });
  }
  x.globalAlpha = a * E.outCubic(seg(t, 1.5, 2.1));
  txt(x, '전반과 후반, 무엇이 달라졌나', CX, 770, { font: F(400, 48, FH), color: C.accent, align: 'center' });
  txt(x, '평균 위치 · 패스 연결 · 공격 방향', CX, 824, { font: F(500, 26), color: C.muted, align: 'center' });
  x.restore();
}

function drawResult(t) {
  const a = win(t, S.res[0], S.end[1] + 1, .5, .01); if (a <= 0) return;
  x.save(); x.globalAlpha = a;
  txt(x, '전반 → 후반', CX, 140, { font: F(700, 26), color: C.muted, align: 'center' });
  txt(x, '막대: 옅은 색 = 전반 몫, 진한 색 = 후반 몫(전·후반 합계 기준) · 평균 위치는 0–100 위의 전반(빈 원)·후반(찬 원)', CX, 180, { font: F(400, 19), color: C.muted, align: 'center' });
  const cols = [['슛', 'shots1', 'shots2', 0, 'team', 'sum'], ['xG', 'xg1', 'xg2', 2, 'team', 'sum'], ['박스 안 터치', 'box', 'box', 0, 'tac', 'sum'], ['평균 위치', 'line', 'line', 1, 'tac', 'track'], ['골', 'g', 'g', 0, 'goal', 'sum']];
  const val = (s, c, h) => { const v = c[4] === 'team' ? T[s][h === 1 ? c[1] : c[2]] : c[4] === 'tac' ? tac(s)[h][c[1]] : HS[h][s === 'h' ? 0 : 1]; return c[3] === 2 ? +v.toFixed(2) : v; };
  const cw = 300, x0 = CX - cw * cols.length / 2 + 120;
  cols.forEach((c, j) => {
    txt(x, c[0], x0 + j * cw + cw / 2, 240, { font: F(700, 22), color: C.ink, align: 'center' });
    txt(x, c[5] === 'track' ? '0–100 기준' : '전·후반 합계 기준', x0 + j * cw + cw / 2, 268, { font: F(400, 17), color: C.muted, align: 'center' });
  });
  ['h', 'a'].forEach((s, i) => {      // 홈 위 / 원정 아래
    const Y = 340 + i * 160, k = E.outCubic(seg(t, S.res[0] + .4 + i * .5, S.res[0] + 1.2 + i * .5));
    x.globalAlpha = a * k;
    txt(x, TN[s], x0 - 40, Y + 30, { font: F(400, 52, FH), color: TC[s], align: 'right', base: 'middle' });
    cols.forEach((c, j) => {
      const v1 = val(s, c, 1), v2 = val(s, c, 2), cx = x0 + j * cw + cw / 2, d = v2 - v1;
      x.font = F(700, 36); const vs = `${v1.toFixed(c[3])} → ${v2.toFixed(c[3])}`, vw = x.measureText(vs).width;
      x.font = F(700, 22); const dw = x.measureText(sgn(d, c[3])).width;
      const L0 = cx - (vw + 10 + dw) / 2;
      txt(x, vs, L0, Y, { font: F(700, 36), color: C.ink, base: 'middle' });
      txt(x, sgn(d, c[3]), L0 + vw + 10, Y + 2, { font: F(700, 22), color: d > 0 ? TC[s] : C.muted, base: 'middle' });
      halfBar(cx - 120, Y + 36, 240, 24, v1, v2, c[5], TC[s], k);
    });
    x.strokeStyle = C.line; x.lineWidth = 1; x.beginPath(); x.moveTo(x0 - 260, Y + 104); x.lineTo(x0 + cw * cols.length, Y + 104); x.stroke();
  });
  // 요점 한 줄(규칙): 주인공 팀의 평균 위치·공격 방향 변화 + 상대 평균 위치
  const L = laneLine(FOCUS), f = tac(FOCUS), o = tac(OTHER);
  const df = f[2].line - f[1].line, dO = o[2].line - o[1].line;
  const move = Math.abs(df) < .5 ? '비슷한 높이를 유지했고' : df > 0 ? '평균 위치를 끌어올렸고' : '평균 위치를 낮췄고';
  const dir = L.m1 !== L.m2 ? `공격 중심을 ${LANE[L.m1]}에서 ${LANE[L.m2]}으로 옮겼습니다` : `${LANE[L.m2]} 공격을 이어 갔습니다`;
  const K1 = `후반 ${josa(TN[FOCUS], '은', '는')} ${move} <em>${dir}</em>`;
  const K2 = `${josa(TN[OTHER], '은', '는')} 평균 위치 ${o[1].line.toFixed(1)} → ${o[2].line.toFixed(1)}(${sgn(dO)})로 ${Math.abs(dO) < .5 ? '비슷했습니다' : dO < 0 ? '더 내려섰습니다' : '더 올라섰습니다'}`;
  const ka = E.outCubic(seg(t, S.end[0], S.end[0] + .6));
  x.globalAlpha = a * ka;
  richCenter(x, K1, CX, 720, F(400, 44, FH), C.ink, TC[FOCUS]);
  txt(x, K2, CX, 782, { font: F(500, 30), color: C.ink, align: 'center' });
  const notes = [
    `평균 위치 = 하프마다 선수별 이벤트(패스·수비·경합·슛·GK·돌파) 좌표 평균, 이벤트 5개 이상인 선수만. 0 = 자기 골라인, 100 = 상대 골라인. 팀 값은 필드 플레이어 평균.`,
    `패스 연결 = 성공 패스 뒤 8초 안에 같은 팀 다른 선수의 다음 이벤트를 받는 선수로 추정, 두 선수 사이 4회 이상만 선으로. 원 크기 = 패스 연결 관여 수.`,
    `공격 방향 = 공격 지역(상대 진영 1/3) 이벤트의 좌·중·우 비율, 공격 방향 기준. 슛 수는 하프 기록, xG는 기대득점 합. 데모용 가상 데이터.`];
  x.globalAlpha = a * E.outCubic(seg(t, S.end[0] + .8, S.end[0] + 1.4));
  notes.forEach((s, i) => txt(x, s, CX, 890 + i * 32, { font: F(400, 19), color: C.muted, align: 'center' }));
  x.restore();
}

function draw(t) {
  x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1;
  x.fillStyle = C.ground; x.fillRect(0, 0, W, H);
  drawTitle(t);
  teamBlock(FOCUS, t, S.f[0], S.lane[1], true);
  teamBlock(OTHER, t, S.o[0], S.o[1], false);
  drawResult(t);
}

// ---------- 페이지 문구 ----------
document.getElementById('h1').textContent = `${M.hn} ${M.hs}–${M.as_} ${M.an}, 전반과 후반`;
document.getElementById('dek').textContent = `전반 ${HS[1][0]}–${HS[1][1]}, 후반 ${HS[2][0]}–${HS[2][1]}. 두 팀의 평균 위치, 패스 연결, 공격 방향이 하프마다 어떻게 달라졌는지 48초로 비교합니다. 가상 리그 ${M.round}라운드 · ${M.date.replaceAll('-', '.')} · ${M.stadium}.`;
document.getElementById('notes').innerHTML = `
  <div><h2>평균 위치</h2><p>하프마다 선수별로 패스·수비·경합·슛·GK·돌파 이벤트 좌표를 평균했습니다. 이벤트가 5개 이상인 선수만 그립니다. 두 팀 모두 오른쪽으로 공격하도록 맞췄고, 0은 자기 골라인, 100은 상대 골라인입니다. 팀 평균 위치는 골키퍼를 뺀 선수들의 평균입니다.</p></div>
  <div><h2>패스 연결</h2><p>이벤트 기록에 받는 선수가 없어, 성공 패스 뒤 8초 안에 나온 같은 팀 다른 선수의 다음 이벤트를 받은 것으로 추정했습니다. 두 선수 사이 연결이 4회 이상일 때만 선을 긋고, 원 크기는 연결 관여 수입니다. 금색 테두리는 교체로 들어온 선수입니다.</p></div>
  <div><h2>공격 방향</h2><p>공격 지역(상대 진영 1/3, x ≥ 66.7)에서 나온 이벤트를 공격 방향 기준 왼쪽·중앙·오른쪽 세 줄로 나눈 비율입니다. 공격 지역 진입 성공 패스는 공격 지역 밖에서 시작해 안에서 끝난 성공 패스를 끝점 방향으로 센 값입니다. 슛·점유율은 하프 기록, xG는 기대득점 합입니다.</p></div>`;

MK.mount({
  draw, duration: 48, hold: 45.5,
  fonts: ['400 40px "Black Han Sans"', '400 20px "IBM Plex Sans KR"', '500 20px "IBM Plex Sans KR"', '700 20px "IBM Plex Sans KR"'],
  chapters: [{ t: 0, label: '하프 스코어' }, { t: S.f[0], label: `${TN[FOCUS]} 평균 위치·패스` }, { t: S.lane[0], label: `${TN[FOCUS]} 공격 방향` },
    { t: S.o[0], label: `${TN[OTHER]} 평균 위치·패스` }, { t: S.res[0], label: '전반 → 후반 수치' }, { t: S.end[0], label: '요점' }],
});
</script>
